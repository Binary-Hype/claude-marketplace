<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code map · __CODE_MAP_TITLE__</title>
<style>
:root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b72; --line: #e2e2de; --soft: #f0f0ec;
    --accent: #e11d48; --ext: #c9c9ce; --e-inherit: #8b5cf6; --e-dep: #7c8798; --e-event: #ea580c; --e-route: #16a34a;
    --bar: #4e79a7;
    color-scheme: light;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #131315; --panel: #1b1b1e; --ink: #ececef; --muted: #9b9ba3; --line: #2d2d32; --soft: #232327;
        --accent: #fb7185; --ext: #4a4a51; --e-inherit: #a78bfa; --e-dep: #8792a6; --e-event: #fb923c; --e-route: #4ade80;
        --bar: #7aa6d6; color-scheme: dark;
    }
}
:root[data-theme="dark"] {
    --bg: #131315; --panel: #1b1b1e; --ink: #ececef; --muted: #9b9ba3; --line: #2d2d32; --soft: #232327;
    --accent: #fb7185; --ext: #4a4a51; --e-inherit: #a78bfa; --e-dep: #8792a6; --e-event: #fb923c; --e-route: #4ade80;
    --bar: #7aa6d6; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
code { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
.top { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
.top h1 { font-size: 16px; margin: 0; font-weight: 650; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--soft); color: var(--muted); font-size: 12px; white-space: nowrap; }
.chip b { color: var(--ink); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 12px; }
.btn:hover { background: var(--soft); }
.overview { padding: 12px 20px; line-height: 1.6; border-bottom: 1px solid var(--line); background: var(--panel); color: var(--ink); max-height: 120px; overflow: auto; }
.overview p { margin: 0; max-width: 110ch; }
.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: clamp(280px, 22vw, 360px) minmax(0, 1fr) clamp(320px, 27vw, 440px); }
.side, .details { background: var(--panel); overflow: auto; min-height: 0; }
.side { border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.details { border-left: 1px solid var(--line); padding: 20px 22px 28px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
.tabs button { border: 0; background: none; padding: 5px 10px; border-radius: 6px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--soft); color: var(--ink); font-weight: 600; }
.list { padding: 8px 10px 16px; }
.list-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 10px; color: var(--muted); font-size: 12px; }
.row { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; margin-bottom: 2px; }
.row:hover, .row.active { background: var(--soft); }
.row .name { display: flex; justify-content: space-between; gap: 8px; font-weight: 550; }
.row .name span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 7px; }
.row .bar i { display: block; height: 100%; background: var(--bar); border-radius: 2px; }
.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.toolbar input[type="search"] { flex: 1 1 280px; min-width: 0; padding: 7px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.toolbar .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
.toolbar label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.toolbar input[type="number"] { width: 7ch; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.chips button.off, .legend button.off { opacity: .4; text-decoration: line-through; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.canvas-wrap { position: relative; flex: 1; min-height: 300px; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
canvas.dragging { cursor: grabbing; }
.tooltip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; box-shadow: 0 4px 14px rgb(0 0 0 / .12); max-width: 360px; font-size: 12px; }
.tooltip .sub { color: var(--muted); }
.flow-banner { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--accent); border-radius: 999px; padding: 4px 6px 4px 14px; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 14px rgb(0 0 0 / .12); }
.legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); max-height: 120px; overflow: auto; }
.legend button { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; }
.details h2 { font-size: 17px; line-height: 1.3; margin: 0; overflow-wrap: anywhere; }
.details h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 0 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.d-head { display: flex; gap: 10px; align-items: flex-start; }
.d-head .dot { width: 12px; height: 12px; margin-top: 4px; }
.sub-id { color: var(--muted); font-size: 12.5px; margin-top: 4px; overflow-wrap: anywhere; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
.badge { padding: 2px 8px; border-radius: 5px; background: var(--soft); border: 1px solid var(--line); font-size: 11.5px; }
.badge.entry { border-color: var(--e-route); color: var(--e-route); }
.badge.warn { border-color: var(--e-event); color: var(--e-event); }
.summary { margin: 12px 0; line-height: 1.6; }
.file { margin: 14px 0 4px; padding: 10px 12px; background: var(--soft); border-radius: 8px; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.file code { flex: 1; }
.muted { color: var(--muted); }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.metric { background: var(--soft); border-radius: 8px; padding: 9px 11px; }
.metric b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.metric span { color: var(--muted); font-size: 12px; }
.links { list-style: none; margin: 0; padding: 0; }
.links li { margin: 5px 0; }
.links button { border: 0; background: none; padding: 2px 0; text-align: left; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; overflow-wrap: anywhere; }
.links button:hover { text-decoration-color: var(--ink); }
.type-label { color: var(--muted); font-size: 12px; margin-top: 12px; }
.flow-row .flow-title, .flow-row .flow-meta, .step-name, .step-meta, .step-text { display: block; }
.flow-row .flow-title { font-size: 14.5px; font-weight: 600; line-height: 1.35; }
.flow-row .flow-meta { color: var(--muted); font-size: 12.5px; line-height: 1.45; margin-top: 5px; white-space: normal; }
.steps { list-style: none; margin: 4px 0 18px; padding: 0; }
.step { width: 100%; display: grid; grid-template-columns: 28px 1fr; gap: 12px; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 12px 14px; }
.step:hover { background: var(--soft); }
.step-num { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; display: grid; place-items: center; }
.step-name { font-weight: 650; font-size: 14.5px; line-height: 1.35; overflow-wrap: anywhere; }
.step-meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.step-text { margin-top: 6px; line-height: 1.55; }
.hop { color: var(--muted); font-size: 12.5px; padding: 6px 0 6px 26px; border-left: 2px solid var(--line); margin-left: 26px; }
.hop.inferred { color: var(--e-event); border-left-style: dashed; border-left-color: var(--e-event); }
.flow-data { margin: 12px 0; padding: 10px 12px; background: var(--soft); border-radius: 8px; line-height: 1.55; }
.layer-bars .row { cursor: default; }
@media (max-width: 1100px) {
    .layout { grid-template-columns: 1fr; overflow: auto; }
    .side { max-height: 320px; border-right: 0; border-bottom: 1px solid var(--line); }
    .stage { height: 70vh; }
    .details { border-left: 0; border-top: 1px solid var(--line); }
    .top { flex-wrap: wrap; }
}
</style>
</head>
<body>
<header class="top">
    <h1>Code map · <span id="repo"></span></h1>
    <div class="meta" id="meta"></div>
    <button class="btn" id="themeBtn" type="button" title="Switch theme">Theme: auto</button>
</header>
<section class="overview" id="overview" hidden></section>
<main class="layout">
    <aside class="side">
        <nav class="tabs" role="tablist" id="tabs">
            <button role="tab" data-tab="used">Most used</button>
            <button role="tab" data-tab="biggest">Biggest</button>
            <button role="tab" data-tab="hubs">Hubs</button>
            <button role="tab" data-tab="entry">Entry points</button>
            <button role="tab" data-tab="flows">Flows</button>
        </nav>
        <div class="list" id="list"></div>
    </aside>
    <section class="stage">
        <div class="toolbar">
            <input id="search" type="search" placeholder="Find a class, file or component…" list="names" autocomplete="off">
            <datalist id="names"></datalist>
            <div class="controls">
            <label>Top <input id="topN" type="range" min="1" step="1" aria-label="Number of components shown"> <input id="topNNum" type="number" min="1" step="1" inputmode="numeric" aria-label="Number of components shown"></label>
            <label><input id="showExt" type="checkbox"> Externals</label>
            <label><input id="groupView" type="checkbox"> Group view</label>
            <button class="btn" id="fitBtn" type="button">Fit</button>
            </div>
        </div>
        <div class="chips" id="edgeChips"></div>
        <div class="canvas-wrap" id="wrap">
            <canvas id="graph" aria-label="Dependency graph"></canvas>
            <div class="tooltip" id="tooltip" hidden></div>
            <div class="flow-banner" id="flowBanner" hidden></div>
        </div>
        <div class="legend" id="legend"></div>
    </section>
    <aside class="details" id="details"></aside>
</main>
<script>
const DATA = /*__CODE_MAP_DATA__*/null;
(() => {
'use strict';
if (!DATA) { document.body.innerHTML = '<p style="padding:2rem">No graph data embedded. Generate this file with render.js.</p>'; return; }

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n || 0).toLocaleString();
const kb = (b) => (b >= 1024 ? `${(b / 1024).toFixed(1)} KB` : `${b} B`);
const push = (map, key, val) => { if (!map.has(key)) map.set(key, []); map.get(key).push(val); };

const ann = DATA.annotations || { overview: '', summaries: {}, flows: [] };
const nodes = DATA.nodes;
const byId = new Map(nodes.map((n) => [n.id, n]));
for (const e of DATA.externals) byId.set(e.id, { ...e, group: 'external', layer: 'External', loc: 0, bytes: 0, methods: 0, fanIn: 0, fanOut: 0, externalDeps: 0, score: 0, entry: [], routes: [], listensTo: [], dispatches: [], hooks: [], dataAccess: [] });
const outE = new Map(); const inE = new Map();
for (const e of DATA.edges) { push(outE, e.source, e); push(inE, e.target, e); }

const groupCounts = new Map();
for (const n of nodes) groupCounts.set(n.group, (groupCounts.get(n.group) || 0) + 1);
const groups = [...groupCounts.keys()].sort((a, b) => groupCounts.get(b) - groupCounts.get(a));
const PALETTE = ['#4e79a7', '#f28e2b', '#59a14f', '#e15759', '#76b7b2', '#edc948', '#b07aa1', '#ff9da7', '#9c755f', '#86bcb6', '#d37295', '#a0cbe8'];
const groupColor = new Map(groups.map((g, i) => [g, PALETTE[i % PALETTE.length]]));
const EDGE_CAT = { extends: 'inherit', implements: 'inherit', 'uses-trait': 'inherit', injects: 'dep', uses: 'dep', instantiates: 'dep', 'static-call': 'dep', imports: 'dep', includes: 'dep', dispatches: 'event', listens: 'event', routes: 'route', calls: 'route', group: 'dep' };
const edgeTypeCounts = new Map();
for (const e of DATA.edges) if (byId.has(e.target) && !e.target.startsWith('ext:')) edgeTypeCounts.set(e.type, (edgeTypeCounts.get(e.type) || 0) + 1);
const flowsOf = (id) => ann.flows.map((f, i) => [f, i]).filter(([f]) => f.steps.includes(id));

const state = { tab: 'used', selected: null, hover: null, flow: null, topN: Math.min(150, nodes.length), showExt: false, groupView: false, hiddenGroups: new Set(), hiddenTypes: new Set() };
let colors = {};
function readColors() {
    const cs = getComputedStyle(document.documentElement);
    for (const k of ['bg', 'panel', 'ink', 'muted', 'line', 'accent', 'ext', 'e-inherit', 'e-dep', 'e-event', 'e-route']) colors[k] = cs.getPropertyValue(`--${k}`).trim();
}
const edgeColor = (type) => colors[`e-${EDGE_CAT[type] || 'dep'}`];
const nodeColor = (n) => (n.external ? colors.ext : n.layer === 'Group' ? groupColor.get(n.group) : groupColor.get(n.group) || colors.muted);
const radius = (n) => (n.layer === 'Group' ? Math.min(60, 10 + Math.sqrt(n.loc) * 0.35) : n.external ? 6 + Math.min(10, Math.sqrt(n.refs || 1)) : Math.min(34, 5 + Math.sqrt(n.loc || 1) * 0.9));

/* ---------- header, overview, toolbar ---------- */
const m = DATA.meta;
$('#repo').textContent = m.repo;
$('#meta').innerHTML = [
    m.frameworks.length ? `<span class="chip">Framework <b>${esc(m.frameworks.join(', '))}</b></span>` : '',
    `<span class="chip"><b>${fmt(m.files)}</b> files</span>`,
    `<span class="chip"><b>${fmt(m.nodeCount)}</b> components</span>`,
    `<span class="chip"><b>${fmt(m.edgeCount)}</b> links</span>`,
    `<span class="chip"><b>${fmt(m.externalCount)}</b> externals</span>`,
    `<span class="chip" title="${esc(m.includes.join('\n'))}">Scope <b>${esc(m.includes.length > 2 ? `${m.includes.length} roots` : m.includes.join(', '))}</b></span>`,
    `<span class="chip">${esc(new Date(m.generatedAt).toLocaleString())}</span>`,
].join('');
if (ann.overview) { $('#overview').hidden = false; $('#overview').innerHTML = `<p>${esc(ann.overview)}</p>`; }
const topN = $('#topN');
const topNNum = $('#topNNum');
topN.max = topNNum.max = String(Math.max(1, nodes.length)); topN.value = topNNum.value = String(state.topN);
$('#names').innerHTML = nodes.slice(0, 3000).map((n) => `<option value="${esc(n.id)}">${esc(n.name)}</option>`).join('');

function renderChips() {
    $('#edgeChips').innerHTML = [...edgeTypeCounts].sort((a, b) => b[1] - a[1]).map(([t, c]) =>
        `<button class="chip ${state.hiddenTypes.has(t) ? 'off' : ''}" data-type="${esc(t)}"><span class="dot" style="background:${edgeColor(t)}"></span>${esc(t)} <b>${fmt(c)}</b></button>`).join('');
}
function renderLegend() {
    $('#legend').innerHTML = groups.map((g) =>
        `<button class="${state.hiddenGroups.has(g) ? 'off' : ''}" data-group="${esc(g)}"><span class="dot" style="background:${groupColor.get(g)}"></span>${esc(g)} <span class="muted">${groupCounts.get(g)}</span></button>`).join('')
        + (state.showExt ? `<button disabled><span class="dot" style="background:${colors.ext}"></span>external (not scanned)</button>` : '');
}

/* ---------- side lists ---------- */
function rowHtml(n, value, max, sub) {
    const pct = max ? Math.max(2, Math.round((value / max) * 100)) : 0;
    return `<button class="row ${state.selected === n.id ? 'active' : ''}" data-id="${esc(n.id)}"><div class="name"><span>${esc(n.name)}</span><span class="muted">${esc(fmt(value))}</span></div>`
        + `<div class="sub">${esc(sub || `${n.layer} · ${n.group}`)}</div><div class="bar"><i style="width:${pct}%"></i></div></button>`;
}
function renderList() {
    for (const b of document.querySelectorAll('#tabs button')) b.setAttribute('aria-selected', String(b.dataset.tab === state.tab));
    const el = $('#list');
    const top = (arr, key) => arr.slice().sort((a, b) => key(b) - key(a)).slice(0, 40).filter((n) => key(n) > 0);
    if (state.tab === 'used') {
        const list = top(nodes, (n) => n.fanIn);
        el.innerHTML = `<div class="list-head">Used by most other components</div>${list.map((n) => rowHtml(n, n.fanIn, list[0] && list[0].fanIn)).join('') || '<p class="muted">No internal links found.</p>'}`;
    } else if (state.tab === 'biggest') {
        const list = top(nodes, (n) => n.loc);
        el.innerHTML = `<div class="list-head">Largest components by lines of code</div>${list.map((n) => rowHtml(n, n.loc, list[0].loc)).join('')}`;
    } else if (state.tab === 'hubs') {
        const key = (n) => n.fanIn * n.fanOut;
        const list = top(nodes, key);
        el.innerHTML = `<div class="list-head">Many in- and outgoing links (fan-in × fan-out)</div>${list.map((n) => rowHtml(n, key(n), key(list[0]), `${n.layer} · in ${n.fanIn} / out ${n.fanOut}`)).join('') || '<p class="muted">No hubs.</p>'}`;
    } else if (state.tab === 'entry') {
        const list = nodes.filter((n) => n.entry.length);
        el.innerHTML = `<div class="list-head">Where execution starts</div>${list.map((n) => rowHtml(n, n.fanOut, 0, `${n.entry.join(', ')} · ${[...n.routes, ...n.listensTo, ...n.hooks][0] || n.group}`)).join('') || '<p class="muted">No entry points detected.</p>'}`;
    } else {
        el.innerHTML = `<div class="list-head">Data flows traced by Claude</div>${ann.flows.map((f, i) =>
            `<button class="row flow-row ${state.flow === i ? 'active' : ''}" data-flow="${i}"><span class="flow-title">${esc(f.name)}</span><span class="flow-meta">${f.steps.length} steps${f.data ? ` · ${esc(f.data)}` : ''}</span></button>`).join('') || '<p class="muted">No flows were annotated for this map.</p>'}`;
    }
}

/* ---------- details ---------- */
function linkList(list, key) {
    const byType = new Map();
    for (const e of list) push(byType, e.type, e);
    return [...byType].map(([type, es]) => `<div class="type-label"><span class="dot" style="background:${edgeColor(type)}"></span> ${esc(type)}</div><ul class="links">${es.map((e) => {
        const n = byId.get(e[key]);
        return `<li><button data-id="${esc(e[key])}">${esc(n ? n.name : e[key])}</button>${n && n.external ? ' <span class="muted">external</span>' : ''}</li>`;
    }).join('')}</ul>`).join('');
}
function renderOverviewPanel() {
    const layers = new Map();
    for (const n of nodes) layers.set(n.layer, (layers.get(n.layer) || 0) + 1);
    const list = [...layers].sort((a, b) => b[1] - a[1]);
    const max = list.length ? list[0][1] : 1;
    const entries = nodes.filter((n) => n.entry.length).length;
    $('#details').innerHTML = `<h2>Overview</h2><p class="muted">Click a node or a list entry for details. Drag to pan, scroll to zoom, drag nodes to rearrange. Node size = lines of code, color = group, ring = entry point.</p>
        <div class="metrics"><div class="metric"><b>${fmt(m.nodeCount)}</b><span>components</span></div><div class="metric"><b>${fmt(entries)}</b><span>entry points</span></div><div class="metric"><b>${fmt(ann.flows.length)}</b><span>flows</span></div></div>
        <h3>Layers</h3><div class="layer-bars">${list.map(([l, c]) => `<div class="row"><div class="name"><span>${esc(l)}</span><span class="muted">${c}</span></div><div class="bar"><i style="width:${Math.round((c / max) * 100)}%"></i></div></div>`).join('')}</div>
        <h3>Framework &amp; libraries (not scanned)</h3><ul class="links">${DATA.externals.slice(0, 12).map((e) => `<li><button data-id="${esc(e.id)}">${esc(e.name)}</button> <span class="muted">${fmt(e.refs)} refs</span></li>`).join('') || '<li class="muted">None</li>'}</ul>`;
}
function renderNodePanel(n) {
    const summary = ann.summaries[n.id];
    const info = [['Routes', n.routes], ['Listens to', n.listensTo], ['Hooks', n.hooks], ['Dispatches', n.dispatches], ['Data access', n.dataAccess]].filter(([, v]) => v && v.length);
    const flows = flowsOf(n.id);
    const ins = (inE.get(n.id) || []).filter((e) => byId.has(e.source));
    const outs = (outE.get(n.id) || []).filter((e) => byId.has(e.target));
    $('#details').innerHTML = `<div class="d-head"><span class="dot" style="background:${nodeColor(n)}"></span><div><h2>${esc(n.name)}</h2>${n.id !== n.name ? `<div class="sub-id">${esc(n.id)}</div>` : ''}</div></div>

$('#fitBtn').addEventListener('click', () => { autoFit = true; fit(autoFitIds); });
$('#search').addEventListener('change', (ev) => {
    const q = ev.target.value.trim().toLowerCase(); if (!q) return;
    const n = byId.get(ev.target.value.trim()) || nodes.find((x) => x.name.toLowerCase() === q) || nodes.find((x) => x.id.toLowerCase().includes(q));
    if (n) select(n.id);
});
const themes = ['auto', 'light', 'dark'];
let themeIdx = 0;
try { themeIdx = Math.max(0, themes.indexOf(localStorage.getItem('code-map-theme') || 'auto')); } catch { /* storage unavailable */ }
function applyTheme() {
    const t = themes[themeIdx];
    if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
    $('#themeBtn').textContent = `Theme: ${t}`; readColors(); renderChips(); renderLegend(); kick();
}
$('#themeBtn').addEventListener('click', () => { themeIdx = (themeIdx + 1) % themes.length; try { localStorage.setItem('code-map-theme', themes[themeIdx]); } catch { /* ignore */ } applyTheme(); });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); renderChips(); renderLegend(); kick(); });
new ResizeObserver(resize).observe($('#wrap'));

applyTheme(); renderList(); renderDetails(); resize(); buildView();
for (let i = 0; i < 200 && view.nodes.length < 1500; i++) tick();
fit();
})();
</script>
</body>
